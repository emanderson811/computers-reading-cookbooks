---
layout: default 
---
<article class="page-content">
    {% if page.title %}
    <header class="page-heading">
        <h1>{{ page.title | escape }}</h1>
        {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle | escape }}</p>{% endif %}
    </header>
    {% endif %}
    <div class="site-prose">
        {{ content }}
    </div>
</article>
